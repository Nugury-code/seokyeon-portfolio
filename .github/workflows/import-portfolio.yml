name: Import portfolio files
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-portfolio.yml'
      - '.github/portfolio-import.json'
      - '.github/scripts/import_portfolio.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: import-portfolio
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Import and verify the prepared public portfolio files
        run: python .github/scripts/import_portfolio.py
      - name: Save the portfolio source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if ! git diff --cached --quiet
          then
            git commit -m "Add portfolio website and verified public assets"
            git push origin HEAD:main
          fi
